[package]
name = "bogusmips"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Analyze how far an Android app (*.apk / *.aab) can be disassembled"
readme = "README.md"

[dependencies]
eframe = "0.32.3"
egui_extras = { version = "0.32", features = ["image"] }
flate2 = "1.1.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
lzma-rs = "0.3"
md-5 = "0.10"
raw-window-handle = "0.6"
rcgen = { version = "0.14.7", default-features = false, features = ["ring", "pem"] }
regex = "1.13.1"
rfd = "0.17.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
sha2 = "0.11.0"
time = { version = "0.3", default-features = false, features = ["std"] }
webpki-roots = "1"

[profile.release]
lto = true
codegen-units = 1

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = "0.19"
