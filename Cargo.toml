[package]
name = "bogusmips"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Analyze how far an Android app (*.apk / *.aab) can be disassembled"
readme = "README.md"

[dependencies]
eframe = "0.32.3"
egui_extras = { version = "0.32", features = ["image"] }
flate2 = "1.1.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rfd = "0.17.2"
sha2 = "0.11.0"

[profile.release]
lto = true
codegen-units = 1
